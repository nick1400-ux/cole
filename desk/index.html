<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0f1113">
<title>Cole Desk</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" href="../Cole%20app/icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --coal:#0f1113; --slab:#171a1d; --slab2:#1f2327; --line:#2b3035; --grid:#23272b;
  --ink:#ece8e1; --dim:#8d949b; --mute:#646b72; --red:#e5484d; --red-d:#7a2327; --uv:#9d7cf2;
  --good:#7fcf9a; --warn:#e9c46a; --bad:#ff7a3d;
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--coal);color:var(--ink);font:15px/1.45 var(--f-body)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.app{display:grid;grid-template-columns:220px minmax(0,1fr);min-height:100vh}
nav.side{position:sticky;top:0;height:100vh;border-right:1px solid var(--line);padding:22px 14px;display:flex;flex-direction:column;gap:2px;background:#0c0e10}
.brand{font:800 22px/1 var(--f-display);letter-spacing:.02em;margin:0 8px 4px}
.brand span{color:var(--red)}
.sub{font:500 11px var(--f-mono);color:var(--dim);letter-spacing:.1em;text-transform:uppercase;margin:0 8px 18px}
nav.side a{display:flex;justify-content:space-between;align-items:center;padding:9px 10px;border-radius:9px;color:var(--dim);text-decoration:none;font-weight:600;font-size:14px}
nav.side a:hover{background:var(--slab);color:var(--ink)}
nav.side a[aria-current="page"]{background:var(--slab2);color:var(--ink);box-shadow:inset 3px 0 0 var(--red)}
nav.side a .k{font:500 11px var(--f-mono);color:var(--mute)}
.side .grow{flex:1}
.side .foot{font-size:12px;color:var(--mute);padding:0 8px;display:flex;flex-direction:column;gap:8px}
.side .foot a.cole{color:var(--ink);background:var(--red-d);justify-content:center}
.side .foot a.cole:hover{background:var(--red)}
main{padding:26px 32px 60px;max-width:1500px;width:100%}
.top{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;margin-bottom:20px;flex-wrap:wrap}
h1{font:700 26px/1.1 var(--f-display);margin:0}
.date{font:500 12px var(--f-mono);color:var(--dim);text-transform:uppercase;letter-spacing:.08em;margin-top:6px}
.seg{display:inline-flex;background:var(--slab);border:1px solid var(--line);border-radius:10px;padding:3px;gap:2px}
.seg button{border:0;background:none;padding:6px 12px;border-radius:7px;color:var(--dim);font-weight:600;font-size:13px}
.seg button[aria-pressed="true"]{background:var(--slab2);color:var(--ink)}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(2,minmax(0,1fr))}
.g3{grid-template-columns:repeat(3,minmax(0,1fr))}
.g4{grid-template-columns:repeat(4,minmax(0,1fr))}
.g6{grid-template-columns:repeat(6,minmax(0,1fr))}
.span2{grid-column:span 2}.span3{grid-column:span 3}
.card{background:var(--slab);border:1px solid var(--line);border-radius:14px;padding:16px 18px;min-width:0}
.card h3{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:0 0 12px;display:flex;justify-content:space-between;gap:8px}
.card h3 .r{color:var(--mute);letter-spacing:.04em;text-transform:none}
.eyebrow{font:600 11px var(--f-mono);letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:26px 0 10px}
.kpi b{display:block;font:700 28px/1.1 var(--f-mono);letter-spacing:-.01em}
.kpi small{color:var(--dim);font-size:13px}
.kpi .bar{height:4px;background:var(--line);border-radius:4px;margin-top:10px;overflow:hidden}
.kpi .bar i{display:block;height:100%;background:var(--red);border-radius:4px}
.good{color:var(--good)}.bad{color:var(--bad)}.warn{color:var(--warn)}.dim{color:var(--dim)}.mono{font-family:var(--f-mono)}
.pill{display:inline-block;font:600 11px var(--f-mono);padding:2px 7px;border-radius:999px;background:var(--slab2);color:var(--dim);border:1px solid var(--line);white-space:nowrap}
.pill.good{color:var(--good);border-color:#2f5a3e}.pill.bad{color:var(--bad);border-color:#6a3420}.pill.warn{color:var(--warn);border-color:#6a5a2a}.pill.red{color:#ff9ca0;border-color:var(--red-d)}
table{width:100%;border-collapse:collapse;font-size:13.5px}
th{font:600 11px var(--f-mono);letter-spacing:.08em;text-transform:uppercase;color:var(--dim);text-align:left;padding:8px 10px;border-bottom:1px solid var(--line);position:sticky;top:0;background:var(--slab)}
td{padding:8px 10px;border-bottom:1px solid var(--grid);vertical-align:top}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:right;font-family:var(--f-mono);white-space:nowrap}
.scroll{max-height:520px;overflow:auto;margin:0 -18px -16px;padding:0 18px}
.list{display:flex;flex-direction:column}
.row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid var(--grid);align-items:baseline}
.row:last-child{border-bottom:0}
.when{font:500 11px var(--f-mono);color:var(--mute);text-transform:uppercase;letter-spacing:.06em}
.entry{padding:10px 0;border-bottom:1px solid var(--grid)}
.entry:last-child{border-bottom:0}
.empty{color:var(--mute);font-size:14px;padding:6px 0}
.strip{display:flex;gap:3px;flex-wrap:wrap}
.strip i{width:14px;height:14px;border-radius:3px;background:var(--slab2);display:block}
.strip i.g{background:var(--good)}.strip i.b{background:var(--bad)}.strip i.n{background:transparent;border:1px dashed var(--line)}
.heat{display:grid;grid-auto-flow:column;grid-template-rows:repeat(7,12px);gap:3px}
.heat i{width:12px;height:12px;border-radius:2px;background:var(--slab2)}
.heat i.g{background:#3c7a52}.heat i.b1{background:#a3502a}.heat i.b2{background:var(--bad)}.heat i.x{background:transparent}
.kan{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:12px}
.kan .col{background:#131619;border:1px solid var(--line);border-radius:12px;padding:12px;min-height:160px}
.kan .col h4{margin:0 0 10px;font:600 11px var(--f-mono);letter-spacing:.1em;text-transform:uppercase;color:var(--dim);display:flex;justify-content:space-between}
.kan .reel{background:var(--slab2);border-radius:9px;padding:9px 10px;margin-bottom:8px;font-size:13.5px}
.kan .reel small{display:block;color:var(--dim);font-size:12px;margin-top:3px}
.week{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:10px}
.week .d{background:#131619;border:1px solid var(--line);border-radius:12px;padding:12px;font-size:13px}
.week .d.today{border-color:var(--red);box-shadow:0 0 0 1px var(--red-d)}
.week .d b{font:600 11px var(--f-mono);letter-spacing:.1em;color:var(--dim)}
.week .d .w{font-weight:700;margin:6px 0 4px}
.tl .row{padding:7px 0}
.tl .t{font:500 12px var(--f-mono);color:var(--dim);width:70px;flex:none}
.tl .now{color:var(--red)}
.search{background:var(--slab2);border:1px solid var(--line);border-radius:9px;padding:8px 12px;min-width:260px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--line);background:var(--slab2);color:var(--dim);border-radius:999px;padding:4px 11px;font-size:12.5px;font-weight:600}
.chip[aria-pressed="true"]{color:var(--ink);border-color:var(--red)}
svg.ch{display:block;width:100%;height:auto;overflow:visible}
svg.ch text{font:500 11px var(--f-mono);fill:var(--mute)}
svg.ch .gl{stroke:var(--grid);stroke-width:1}
svg.ch .zero{stroke:var(--line);stroke-width:1}
svg.ch .hit{fill:transparent}
svg.ch .hit:hover+.dot,svg.ch g.pt:hover .dot{opacity:1}
svg.ch .dot{opacity:0}
svg.ch g.pt:hover .vline{opacity:1}
svg.ch .vline{opacity:0;stroke:var(--dim);stroke-width:1;stroke-dasharray:3 3}
svg.ch rect.bar:hover{filter:brightness(1.25)}
#tip{position:fixed;pointer-events:none;background:#000;border:1px solid var(--line);border-radius:8px;padding:7px 10px;font-size:12.5px;line-height:1.4;max-width:320px;z-index:50;display:none;box-shadow:0 6px 20px #0008}
#tip b{font-family:var(--f-mono)}
.login{max-width:380px;margin:12vh auto;padding:28px;background:var(--slab);border:1px solid var(--line);border-radius:16px;display:flex;flex-direction:column;gap:12px}
.login input{background:var(--slab2);border:1px solid var(--line);border-radius:10px;padding:11px 12px}
.btn{background:var(--red);border:0;border-radius:10px;padding:10px 16px;font-weight:700;color:#fff}
.btn.ghost{background:var(--slab2);color:var(--ink);border:1px solid var(--line)}
.sync{font:500 11px var(--f-mono);color:var(--mute)}
.legend{display:flex;gap:14px;font-size:12px;color:var(--dim);margin-top:8px}
.legend span::before{content:"";display:inline-block;width:10px;height:3px;border-radius:2px;margin-right:6px;vertical-align:middle;background:var(--c)}
.note{font-size:13px;color:var(--dim);margin-top:8px}
@media (max-width:1180px){.g4,.g6{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}.span3{grid-column:span 2}.kan{grid-template-columns:repeat(3,minmax(0,1fr))}.week{grid-template-columns:repeat(4,minmax(0,1fr))}}
@media (max-width:760px){.app{grid-template-columns:1fr}nav.side{position:static;height:auto;flex-direction:row;flex-wrap:wrap}.side .grow,.side .sub,.side .foot{display:none}main{padding:18px 16px}.g2,.g3,.g4,.g6{grid-template-columns:1fr}.span2,.span3{grid-column:auto}.kan,.week{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<div id="login" class="login" hidden>
  <div class="brand">COLE <span>DESK</span></div>
  <div class="dim" id="lgMsg">Sign in with your Cole email and password.</div>

  <a class="dim" href="../Cole%20app/" style="font-size:13px">Forgot your password? Reset it in Cole.</a>
</div>
<div class="app" id="app" hidden>
  <nav class="side" id="nav"></nav>
  <main id="main"></main>
</div>
<div id="tip"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
const DESK_BUILD="2026-10-09-desk1";
const SB_URL="https://ntuzsyfzgfgxkmyqniqz.supabase.co", SB_KEY="sb_publishable_RxVn21A1NCVsMlCh03cvHw_vnBxCP2q";

/* ---------- plan constants (mirrors Cole app/index.html) ---------- */

const pad=n=>String(n).padStart(2,"0");

const now=()=>new Date(); const TODAY=()=>keyOf(now());

const num=v=>(v===""||v===null||v===undefined||isNaN(+v))?null:+v;
const sum=(a,f)=>a.reduce((s,x)=>s+(num(typeof f==="function"?f(x):x[f])||0),0);
const money=n=>(n<0?"-$":"$")+Math.abs(Math.round(n*100)/100).toLocaleString(undefined,{maximumFractionDigits:2});
const fR=v=>(v>0?"+":"")+(Math.round(v*100)/100)+"R";
const fDay=k=>new Date(k+"T12:00").toLocaleDateString(undefined,{weekday:"short",month:"short",day:"numeric"});
const fTime=t=>t?new Date(t).toLocaleTimeString([],{hour:"numeric",minute:"2-digit"}):"";
const blankDay=()=>({checkin:null,trades:[],meals:[],spend:[],gym:false,reel:false,family:false,journal:[],ideas:[],tasks:[],sched:{},laptop:{},slips:{},slipLog:[]});
const day=k=>days[k]||blankDay();

const ruleLabel=id=>{const r=ruleList().find(x=>x.id===id);if(r)return id==="window"?`Inside the ${RC().winStart}–${RC().winEnd} window`:r.text;return (RC().retired||{})[id]||id};
const tradeClean=t=>!!(t&&t.rules&&Object.keys(t.rules).length)&&Object.values(t.rules).every(Boolean)&&ruleList().every(r=>!(r.id in t.rules)||t.rules[r.id]);
const dayClean=d=>d.trades.length<=RC().maxTrades&&d.trades.every(tradeClean);

const slipsOn=(k,id)=>((days[k]||{}).slips||{})[id]||0;

function lastN(n){const out=[];const d=now();for(let i=n-1;i>=0;i--){const c=new Date(d);c.setDate(d.getDate()-i);out.push(keyOf(c))}return out}
function rangeKeys(){if(ui.range)return lastN(ui.range);const ks=Object.keys(days).sort();if(!ks.length)return lastN(30);const out=[];const d=new Date(ks[0]+"T12:00"),end=now();while(keyOf(d)<=keyOf(end)){out.push(keyOf(d));d.setDate(d.getDate()+1)}return out}
function allTrades(keys){return keys.flatMap(k=>(day(k).trades||[]).map((t,i)=>({...t,k,i})))}
const tR=t=>num(t.r), tP=t=>num(t.pnl);

/* ---------- charts (hand-built SVG, hover tooltips) ---------- */
function scale(lo,hi,a,b){if(hi===lo){hi=lo+1}return v=>a+(v-lo)/(hi-lo)*(b-a)}
function niceTicks(lo,hi,n=4){const span=hi-lo||1;const step0=span/n;const mag=Math.pow(10,Math.floor(Math.log10(step0)));const step=[1,2,2.5,5,10].map(x=>x*mag).find(x=>x>=step0)||mag*10;const out=[];for(let v=Math.ceil(lo/step)*step;v<=hi+1e-9;v+=step)out.push(+v.toFixed(6));return out}
function lineChart(pts,{W=760,h=220,fmt=v=>v,color="var(--red)",target=null,targetLabel="",area=true}={}){
  if(!pts.length)return `<div class="empty">Nothing logged in this range yet.</div>`;
  const L=46,R=12,T=12,B=26,ys=pts.map(p=>p.y).concat(target!=null?[target]:[]);
  let lo=Math.min(0,...ys),hi=Math.max(0,...ys);if(lo===hi)hi=lo+1;const ticks=niceTicks(lo,hi);lo=Math.min(lo,ticks[0]);hi=Math.max(hi,ticks[ticks.length-1]);
  const x=scale(0,Math.max(1,pts.length-1),L,W-R),y=scale(lo,hi,h-B,T);
  const path=pts.map((p,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(p.y).toFixed(1)).join("");
  const ar=area?`<path d="${path}L${x(pts.length-1).toFixed(1)} ${y(0)}L${x(0)} ${y(0)}Z" fill="${color}" opacity=".12"/>`:"";
  const lab=pts.length>1?[0,Math.floor((pts.length-1)/2),pts.length-1]:[0];
  const cw=(W-L-R)/Math.max(1,pts.length);
  return `<svg class="ch" viewBox="0 0 ${W} ${h}" role="img">
   ${ticks.map(t=>`<line class="${t===0?"zero":"gl"}" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${esc(fmt(t))}</text>`).join("")}
   ${target!=null?`<line x1="${L}" x2="${W-R}" y1="${y(target)}" y2="${y(target)}" stroke="var(--warn)" stroke-dasharray="5 4" stroke-width="1.5"/><text x="${W-R}" y="${y(target)-6}" text-anchor="end" style="fill:var(--warn)">${esc(targetLabel)}</text>`:""}
   ${ar}<path d="${path}" fill="none" stroke="${color}" stroke-width="2" stroke-linejoin="round" stroke-linecap="round"/>
   ${lab.map(i=>`<text x="${x(i)}" y="${h-6}" text-anchor="${i===0?"start":i===pts.length-1?"end":"middle"}">${esc(pts[i].label)}</text>`).join("")}
   ${pts.map((p,i)=>`<g class="pt" data-tip="${esc(p.tip||(p.label+" · "+fmt(p.y)))}"><line class="vline" x1="${x(i)}" x2="${x(i)}" y1="${T}" y2="${h-B}"/><rect class="hit" x="${x(i)-Math.max(cw,6)/2}" y="${T}" width="${Math.max(cw,6)}" height="${h-B-T}"/><circle class="dot" cx="${x(i)}" cy="${y(p.y)}" r="5" fill="${color}" stroke="var(--slab)" stroke-width="2"/></g>`).join("")}
  </svg>`;
}
function barChart(pts,{W=760,h=200,fmt=v=>v,signed=false,color="var(--red)",target=null,targetLabel="",labelEvery=0}={}){
  if(!pts.length)return `<div class="empty">Nothing logged in this range yet.</div>`;
  const L=46,R=12,T=12,B=26,ys=pts.map(p=>p.y).concat(target!=null?[target]:[]);
  let lo=Math.min(0,...ys),hi=Math.max(0,...ys);if(lo===hi)hi=lo+1;const ticks=niceTicks(lo,hi);lo=Math.min(lo,ticks[0]);hi=Math.max(hi,ticks[ticks.length-1]);
  const y=scale(lo,hi,h-B,T),bw=(W-L-R)/pts.length,gap=Math.min(6,bw*.25),y0=y(0);
  const every=labelEvery||Math.ceil(pts.length/8);
  return `<svg class="ch" viewBox="0 0 ${W} ${h}" role="img">
   ${ticks.map(t=>`<line class="${t===0?"zero":"gl"}" x1="${L}" x2="${W-R}" y1="${y(t)}" y2="${y(t)}"/><text x="${L-8}" y="${y(t)+4}" text-anchor="end">${esc(fmt(t))}</text>`).join("")}
   ${pts.map((p,i)=>{const w=Math.max(1,Math.min(48,bw-gap)),x0=L+i*bw+(bw-w)/2,yy=y(p.y),top=Math.min(yy,y0),ht=Math.max(p.y?1.5:0,Math.abs(yy-y0));const c=p.color||(signed?(p.y<0?"var(--bad)":"var(--good)"):color);
     const r=Math.min(4,w/2,ht);

  const month=t.slice(0,7),mk=Object.keys(days).filter(k=>k.startsWith(month)).sort();

  const favs={};ks.forEach(k=>(day(k).meals||[]).forEach(x=>{const n=x.name||"?";favs[n]=favs[n]||{n:0,cost:0,p:0};favs[n].n++;favs[n].cost+=+x.cost||0;favs[n].p+=+x.p||0}));
  const fl=Object.entries(favs).sort((a,b)=>b[1].n-a[1].n).slice(0,10);

  const row=(lab,v,tg,u)=>`<div style="margin-bottom:12px"><div style="display:flex;justify-content:space-between"><span>${lab}</span><span class="mono">${v} / ${tg}${u}</span></div><div class="kpi"><div class="bar"><i style="width:${Math.min(100,v/tg*100)}%;background:${v>=tg*.9?"var(--good)":"var(--red)"}"></i></div></div></div>`;
  return `
  <div class="grid g6">
    ${kpi(avg("p")+" g",`avg protein · goal ${TARGETS.p}`,avg("p")>=TARGETS.p?"good":"")}
    ${kpi(avg("kcal").toLocaleString(),`avg calories · goal ${TARGETS.kcal.toLocaleString()}`)}
    ${kpi(`${hitP}/${fed.length}`,"days protein hit")}
    ${kpi(fed.length,`days logged · ${rangeName()}`)}
    ${kpi(money(cum),`food this month of ${money(TARGETS.foodMonth)}`,cum>TARGETS.foodMonth?"bad":"",cum/TARGETS.foodMonth*100)}
    ${kpi(money(sum(ks,foodSpend)),`food spend · ${rangeName()}`)}
  </div>
  <div class="grid g3" style="margin-top:14px">
    ${card("Protein by day",barChart(pBars,{fmt:v=>v+"g",target:TARGETS.p,targetLabel:TARGETS.p+" g goal"}),"span2")}
    ${card("Today",row("Protein",m.p,TARGETS.p," g")+row("Calories",m.kcal,TARGETS.kcal,"")+row("Carbs",m.c,TARGETS.c," g")+row("Fat",m.f,TARGETS.f," g")+`<div class="note">${m.p>=TARGETS.p?"Protein hit. Finish the calories.":`${TARGETS.p-m.p} g protein to go · ${Math.max(0,TARGETS.kcal-m.kcal)} kcal left`}</div>`)}
  </div>

    ${card("Calories by day",barChart(kBars,{W:560,fmt:v=>v>=1000?(v/1000)+"k":v,target:TARGETS.kcal,targetLabel:"2,700 goal",color:"var(--uv)"}))}
    ${card("Food money this month",lineChart(fm,{W:560,fmt:v=>"$"+v,target:TARGETS.foodMonth,targetLabel:"$180 target"}),"","running total")}
  </div>
  <div class="grid g3" style="margin-top:14px">
    ${card("What you eat most",fl.length?`<table><thead><tr><th>Meal</th><th class="n">Times</th><th class="n">Avg P</th><th class="n">Spent</th></tr></thead><tbody>${fl.map(([nm,x])=>`<tr><td>${esc(nm)}</td><td class="n">${x.n}</td><td class="n">${Math.round(x.p/x.n)} g</td><td class="n">${money(x.cost)}</td></tr>`).join("")}</tbody></table>`:`<div class="empty">No meals logged.</div>`)}
    ${card("Every meal",meals.length?`<div class="scroll" style="max-height:420px"><table><thead><tr><th>Day</th><th>Meal</th><th class="n">kcal</th><th class="n">P / C / F</th><th class="n">$</th></tr></thead><tbody>${meals.map(x=>`<tr><td>${fDay(x.k)}</td><td>${esc(x.name)}</td><td class="n">${x.kcal||0}</td><td class="n">${x.p||0} / ${x.c||0} / ${x.f||0}</td><td class="n">${x.cost?money(+x.cost):"—"}</td></tr>`).join("")}</tbody></table></div>`:`<div class="empty">No meals in this range.</div>`,"span2",`${meals.length} meals`)}
  </div>`;
}

function habStreak(h){let n=0;const d=now();if(slipsOn(keyOf(d),h.id)>0)return 0;for(let i=0;i<400;i++){const k=keyOf(d);if(k<(h.since||"2000-01-01"))break;if(slipsOn(k,h.id)>0)break;n++;d.setDate(d.getDate()-1)}return n}
function heat(fn,weeks=18){const end=now(),start=new Date(end);start.setDate(end.getDate()-(weeks*7-1)-end.getDay());const cells=[];const d=new Date(start);while(keyOf(d)<=keyOf(end)){cells.push(fn(keyOf(d)));d.setDate(d.getDate()+1)}return `<div class="heat">${cells.join("")}</div>`}
function vHabits(){
  const hs=habitsList(),ks=rangeKeys();
  const tradeHeat=heat(k=>{const x=day(k);if(!x.trades.length)return`<i data-tip="${fDay(k)} · no trades"></i>`;const c=dayClean(x);return`<i class="${c?"g":"b2"}" data-tip="${fDay(k)} · ${c?"clean":"rule broken"}"></i>`});
  const trig={};ks.forEach(k=>(day(k).slipLog||[]).forEach(x=>{if(x.trigger)trig[x.trigger]=(trig[x.trigger]||0)+1}));
  const tl=Object.entries(trig).sort((a,b)=>b[1]-a[1]);
  const hours={};ks.forEach(k=>(day(k).slipLog||[]).forEach(x=>{if(x.at){const h=new Date(x.at).getHours();hours[h]=(hours[h]||0)+1}}));
  const hb=Array.from({length:18},(_,i)=>i+6).map(h=>({y:hours[h]||0,label:(h%12||12)+(h<12?"a":"p"),tip:`${(h%12||12)}${h<12?" AM":" PM"} · ${hours[h]||0} slips`}));
  const flags=[["gym","Gym"],["reel","Reel posted"],["family","Time with siblings"]].map(([f,l])=>{const n=ks.filter(k=>day(k)[f]||(f==="gym"&&day(k).sched&&day(k).sched.lift)).length;return`<div class="row"><span>${l}</span><b class="mono">${n}/${ks.length} days</b></div>`}).join("");
  return `
  <div class="grid g2">
    ${card("Trading rules",`${tradeHeat}<div class="legend"><span style="--c:#3c7a52">clean day</span><span style="--c:var(--bad)">rule broken</span><span style="--c:var(--line)">no trades</span></div>`,"","18 weeks")}
    ${card("Showing up",`<div class="list">${flags}</div>`,"",rangeName())}
  </div>
  ${hs.length?`<div class="grid g2" style="margin-top:14px">${hs.map(h=>{const sl=ks.reduce((t,k)=>t+slipsOn(k,h.id),0),st=habStreak(h);
    return card(esc(h.name),`<div class="grid g3" style="gap:10px;margin-bottom:12px"><div class="kpi"><b class="${st?"good":"bad"}">${st}</b><small>day streak</small></div><div class="kpi"><b class="${sl?"bad":"good"}">${sl}</b><small>slips · ${rangeName()}</small></div><div class="kpi"><b>${slipsOn(TODAY(),h.id)}</b><small>today</small></div></div>${heat(k=>{if(k<(h.since||""))return`<i class="x"></i>`;const n=slipsOn(k,h.id);return`<i class="${n>=2?"b2":n?"b1":"g"}" data-tip="${fDay(k)} · ${n?n+" slip"+(n>1?"s":""):"clean"}"></i>`})}`,"",`since ${esc(h.since||"")}`)}).join("")}</div>`:`<div class="card" style="margin-top:14px"><div class="empty">No habits tracked yet. Add them in Cole's Today tab.</div></div>`}
  <div class="grid g2" style="margin-top:14px">
    ${card("What sets you off",tl.length?`<div class="list">${tl.map(([t,n])=>`<div class="row"><span>${esc(t)}</span><span class="pill bad">${n}×</span></div>`).join("")}</div>`:`<div class="empty">No triggers logged in this range.</div>`)}
    ${card("When slips happen",barChart(hb,{W:560,h:200,labelEvery:2}),"","by hour of day")}
  </div>`;
}

function vMind(){
  const ks=Object.keys(days).sort().reverse();

  const open=tasks.filter(x=>!x.done),done=tasks.filter(x=>x.done);

  let jr=ks.flatMap(k=>(days[k].journal||[]).filter(j=>!j.hidden).map(j=>({...j,k}))).sort((a,b)=>(b.at||0)-(a.at||0)||(b.k>a.k?1:-1));
  const counts={};jr.forEach(j=>counts[j.tag||"journal"]=(counts[j.tag||"journal"]||0)+1);

      ${done.length?card("Done lately",`<div class="list">${done.slice(0,8).map(x=>`<div class="row"><span class="dim" style="text-decoration:line-through">${esc(x.text)}</span><span class="when">${x.k.slice(5)}</span></div>`).join("")}</div>`):""}
    </div>
  </div>`;

function postStreak(){let s=0;const d=now();const rs=reels();for(let i=0;i<120;i++){const k=keyOf(d);const p=(days[k]&&days[k].reel)||rs.some(r=>r.postedOn===k);if(p)s++;else if(i>0)break;d.setDate(d.getDate()-1)}return s}

const RANGED=["trading","fuel","habits","money"];

let syncText="";
function renderNav(){
  const cur=current();
  document.getElementById("nav").innerHTML=`<div class="brand">COLE <span>DESK</span></div><div class="sub">Nick's command center</div>
   ${VIEWS.map(([id,l,k])=>`<a href="#${id}" ${id===cur?'aria-current="page"':""}><span>${l}</span><span class="k">${k}</span></a>`).join("")}
   <div class="grow"></div>
   <div class="foot"><a class="cole" href="../Cole%20app/" target="_blank" rel="noopener">Open Cole to log</a><a href="../spikey/" target="_blank" rel="noopener" style="justify-content:center">Open Spikey</a><span class="sync" id="sync">${esc(syncText)}</span><button class="btn ghost" data-act="out" style="font-size:12px;padding:6px">Sign out</button></div>`;

function render(){

  if(focusQ){const q=document.getElementById("q");if(q){q.focus();q.setSelectionRange(selS,selS)}}

function setSync(t){syncText=t;const el=document.getElementById("sync");if(el)el.textContent=t}
addEventListener("hashchange",()=>{window.scrollTo(0,0);render()});
document.addEventListener("click",e=>{
  const s=e.target.closest("[data-seg] button");if(s){const k=s.parentElement.dataset.seg;ui[k]=k==="range"?+s.dataset.v:s.dataset.v;return render()}
  const m=e.target.closest("[data-mkt]");if(m){ui.mkt=m.dataset.mkt;return render()}
  const j=e.target.closest("[data-jtag]");if(j){ui.jTag=j.dataset.jtag;return render()}

document.addEventListener("input",e=>{if(e.target.id==="q"){ui.q=e.target.value;render()}});
document.addEventListener("keydown",e=>{if(["INPUT","TEXTAREA"].includes((document.activeElement||{}).tagName)||e.metaKey||e.ctrlKey||e.altKey)return;const v=VIEWS.find(x=>x[2]===e.key);if(v)location.hash=v[0]});

/* ---------- data ---------- */
function ingest(path,data){
  if(!path)return;
  if(path.startsWith("days/")){days[path.slice(5)]=Object.assign(blankDay(),data||{});["trades","meals","spend","journal","ideas","tasks","slipLog"].forEach(f=>{if(!Array.isArray(days[path.slice(5)][f]))days[path.slice(5)][f]=[]})}
  else if(path.startsWith("backtest/"))bt[path.slice(9)]=data;
  else if(path==="meta/rules")meta.rules=data;else if(path==="meta/habits")meta.habits=data;else if(path==="meta/pipeline")meta.pipeline=data;else if(path==="meta/links")meta.links=data;
  else if(path==="spikey/learned")learned=data;else if(path==="spikey/slides")slides=data;
}
async function loadAll(){
  let from=0;const size=1000;
  for(;;){const {data,error}=await sb.from("cole_docs").select("path,data").range(from,from+size-1);
    if(error)throw error;(data||[]).forEach(r=>ingest(r.path,r.data));if(!data||data.length<size)break;from+=size}
}
let rt=null;
function scheduleRender(){clearTimeout(rt);rt=setTimeout(()=>{const a=document.activeElement;if(a&&a.id==="q")return;render()},400)}
async function afterLogin(user){
  uid=user.id;document.getElementById("login").hidden=true;document.getElementById("app").hidden=false;
  setSync("Loading…");render();
  try{await loadAll();setSync("● Live · updates as you log")}catch(e){setSync("Couldn't load: "+(e.message||e))}
  render();
  sb.channel("desk-"+uid).on("postgres_changes",{event:"*",schema:"public",table:"cole_docs",filter:"user_id=eq."+uid},pl=>{const r=pl.new&&pl.new.path?pl.new:null;if(!r)return;ingest(r.path,r.data);scheduleRender()}).subscribe();
  setInterval(()=>{if(document.visibilityState==="visible")scheduleRender()},60000);
  document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible")loadAll().then(scheduleRender).catch(()=>{})});
}
async function checkUpdate(){if(location.protocol==="file:")return;try{const r=await fetch(location.pathname+"?check="+Date.now(),{cache:"no-store"});const t=await r.text();const m=t.match(/const DESK_BUILD="([^"]+)"/);if(m&&m[1]!==DESK_BUILD&&(document.activeElement||{}).id!=="q")location.reload()}catch(e){}}
setInterval(checkUpdate,5*60*1000);
(async()=>{
  if(!window.supabase){document.body.innerHTML='<div class="login"><b>Couldn\'t load.</b><div class="dim">Check the internet connection and reopen Cole Desk.</div></div>';return}
  sb=window.supabase.createClient(SB_URL,SB_KEY,{auth:{persistSession:true,autoRefreshToken:true}});
  const {data:{session}}=await sb.auth.getSession();
  if(session)return afterLogin(session.user);
  const Lg=document.getElementById("login"),msg=document.getElementById("lgMsg");Lg.hidden=false;
  const go=async()=>{msg.textContent="Signing in…";const {data,error}=await sb.auth.signInWithPassword({email:document.getElementById("lgEmail").value.trim(),password:document.getElementById("lgPass").value});
    if(error){msg.textContent="Couldn't sign in: "+error.message;return}afterLogin(data.user)};
  document.getElementById("lgIn").onclick=go;document.getElementById("lgPass").addEventListener("keydown",e=>{if(e.key==="Enter")go()});
})();
</script>
</body></html>
