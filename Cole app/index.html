<!doctype html>
<html lang="en"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cole">
<meta name="theme-color" content="#0f1113">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-180.png">

<title>Cole</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@600;800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --coal:#0f1113; --slab:#171a1d; --slab2:#1f2327; --line:#2b3035;
  --ink:#ece8e1; --dim:#8d949b; --ice:#e5484d; --ice-d:#7a2327;
  --good:#7fcf9a; --warn:#e9c46a; --bad:#ff7a3d;
  --r:14px;
  --f-display:"Unbounded",system-ui,sans-serif;
  --f-body:"Figtree",system-ui,-apple-system,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--coal);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;margin:0}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ice);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding-inline:16px;padding-block:16px 110px}
header.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px;margin-bottom:14px}
.brand{font-family:var(--f-display);font-weight:800;font-size:28px;letter-spacing:.02em;line-height:1}
.brand span{color:var(--ice)}
.date{font-family:var(--f-mono);font-size:12px;color:var(--dim);text-align:right;text-transform:uppercase;letter-spacing:.06em}
.mission{font-size:13px;color:var(--dim);border-left:2px solid var(--ice-d);padding:2px 0 2px 10px;margin:0 0 18px}
.eyebrow{font-family:var(--f-mono);font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--dim);margin:22px 0 8px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stat{background:var(--slab);border-radius:var(--r);padding:10px 10px 12px}
.stat b{display:block;font-family:var(--f-mono);font-size:20px;font-variant-numeric:tabular-nums;line-height:1.1}
.stat small{font-size:11px;color:var(--dim)}
.bar{height:4px;background:var(--line);border-radius:2px;margin-top:8px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--ice);border-radius:2px;transition:width .3s}
.bar.good i{background:var(--good)} .bar.warn i{background:var(--warn)} .bar.bad i{background:var(--bad)}
.list{display:flex;flex-direction:column;gap:8px}
.task{display:flex;align-items:center;gap:12px;background:var(--slab);border:1px solid transparent;border-radius:var(--r);padding:13px 14px;text-align:left;width:100%}
.task:hover{border-color:var(--line)}
.task .chk{flex:none;width:26px;height:26px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:14px;color:var(--coal)}
.task.done .chk{background:var(--good);border-color:var(--good)}
.task.done .t{color:var(--dim)}
.task .t{font-weight:600}
.task .s{font-size:13px;color:var(--dim)}
.task .go{margin-left:auto;color:var(--dim);font-family:var(--f-mono);font-size:12px;white-space:nowrap}
.banner{border-radius:var(--r);padding:12px 14px;font-size:14px;display:flex;gap:10px;align-items:flex-start}
.banner.warn{background:#332a12;color:#f3e2ae}
.banner.bad{background:#35200f;color:#ffd2b8}
.banner.ice{background:#2a1517;color:#f6cdcb}
.banner strong{display:block}
.card{background:var(--slab);border-radius:var(--r);padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap}
.seg{display:flex;background:var(--slab2);border-radius:10px;padding:3px;gap:3px}
.seg button{flex:1;border:0;background:none;padding:8px 6px;border-radius:8px;font-weight:600;font-size:13px;color:var(--dim)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--coal)}
label.f{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--dim);flex:1;min-width:90px}
input[type=text],input[type=number],textarea,select{background:var(--slab2);border:1px solid var(--line);border-radius:10px;padding:10px 12px;width:100%;font-size:15px}
textarea{resize:vertical;min-height:64px}
.btn{border:0;border-radius:12px;padding:13px 16px;font-weight:700;background:var(--ice);color:#fff;width:100%;font-size:15px}
.btn.ghost{background:var(--slab2);color:var(--ink)}
.btn.sm{width:auto;padding:9px 12px;font-size:13px;border-radius:10px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:none;border-radius:999px;padding:7px 11px;font-size:13px;color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ice);border-color:var(--ice);color:#fff;font-weight:600}
.scale{display:grid;grid-template-columns:repeat(10,1fr);gap:4px}
.scale button{border:1px solid var(--line);background:none;border-radius:8px;padding:8px 0;font-family:var(--f-mono);font-size:13px}
.scale button[aria-pressed="true"]{background:var(--ink);color:var(--coal);border-color:var(--ink)}
.rules{display:flex;flex-direction:column;gap:6px}
.rule{display:flex;gap:10px;align-items:center;font-size:14px;padding:9px 10px;border-radius:10px;background:var(--slab2)}
.rule input{width:18px;height:18px;accent-color:var(--good)}
.item{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-size:14px}
.item:last-child{border-bottom:0}
.item .m{font-family:var(--f-mono);font-size:12px;color:var(--dim);white-space:nowrap}
.x{border:0;background:none;color:var(--dim);font-size:18px;padding:0 4px}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.pill{font-family:var(--f-mono);font-size:11px;padding:3px 7px;border-radius:6px;background:var(--slab2);color:var(--dim)}
.pill.good{color:var(--good)} .pill.bad{color:var(--bad)} .pill.warn{color:var(--warn)}
.week{display:flex;flex-direction:column;gap:6px}
.day{background:var(--slab);border-radius:12px;padding:11px 13px;display:grid;grid-template-columns:44px 1fr;gap:10px;align-items:start}
.day.today{outline:1px solid var(--ice-d);background:#241315}
.day .d{font-family:var(--f-mono);font-size:12px;color:var(--dim);padding-top:2px}
.day.today .d{color:var(--ice)}
.day .w{font-weight:600}
.day .n{font-size:13px;color:var(--dim)}
.ex{margin:0;padding-left:18px;font-size:14px}
.ex li{padding:3px 0}
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:rgba(15,17,19,.94);backdrop-filter:blur(10px);border-top:1px solid var(--line);padding:8px 8px calc(8px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);gap:2px}
nav.tabs button{border:0;background:none;color:var(--dim);padding:8px 0 6px;border-radius:10px;font-size:12px;font-weight:600;display:flex;flex-direction:column;align-items:center;gap:3px}
nav.tabs button svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
nav.tabs button[aria-current="page"]{color:var(--ice);background:var(--slab)}
.sync{font-size:11px;color:var(--dim);text-align:center;margin-top:22px;font-family:var(--f-mono)}
.muted{color:var(--dim);font-size:13px}
.big{font-family:var(--f-mono);font-size:34px;font-weight:700;letter-spacing:-.02em}
.gap{display:flex;flex-direction:column;gap:10px}
.talk{display:flex;align-items:center;gap:14px;width:100%;border:1px solid var(--ice-d);background:linear-gradient(135deg,#2a1416,#171a1d);border-radius:var(--r);padding:16px;text-align:left}
.talk .mic{flex:none;width:46px;height:46px;border-radius:50%;background:var(--ice);display:grid;place-items:center}
.talk .mic svg{width:22px;height:22px;stroke:#fff;fill:none;stroke-width:2}
.talk b{font-size:16px}
.sector{border-left:3px solid var(--ice-d);padding-left:12px}
.sector h4{margin:0 0 4px;font-family:var(--f-mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ice)}
.entry{background:var(--slab2);border-radius:10px;padding:10px 12px;font-size:14px}
.entry .when{font-family:var(--f-mono);font-size:11px;color:var(--dim);margin-bottom:3px}
#dumpText{min-height:140px}
.tl{display:flex;flex-direction:column}
.blk{display:grid;grid-template-columns:52px 1fr auto;gap:10px;align-items:center;padding:10px 12px;border-radius:12px;background:none;border:0;text-align:left;width:100%}
.blk .tm{font-family:var(--f-mono);font-size:12px;color:var(--dim);font-variant-numeric:tabular-nums}
.blk .bt{font-weight:600}
.blk .bd{font-size:13px;color:var(--dim)}
.blk .ck{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);display:grid;place-items:center;font-size:13px;color:var(--coal)}
.blk.done .ck{background:var(--good);border-color:var(--good)}
.blk.done .bt{color:var(--dim);text-decoration:line-through;text-decoration-color:var(--line)}
.blk.past:not(.done) .bt{color:var(--dim)}
.blk.now{background:#241315;outline:1px solid var(--ice-d)}
.blk.now .tm{color:var(--ice)}
.blk.drive .bt{font-weight:500;color:var(--dim)}
.blk.trade .bt{color:var(--bad)}
.blk.sub{padding-left:26px}
.blk.sub .tm{font-size:10px}
.nowcard{margin-top:8px;display:block;width:100%;text-align:left;border:1px solid var(--ice-d);background:#241315;border-radius:var(--r);padding:14px}
.nowcard .lbl{font-family:var(--f-mono);font-size:10px;letter-spacing:.12em;color:var(--ice)}
.nowcard .ttl{font-size:20px;font-weight:700;margin:2px 0}
.nowcard.trade{border-color:#7a3a14;background:#2b1a0f}
.nowcard.trade .lbl{color:var(--bad)}
.timer{font-family:var(--f-mono);font-size:44px;font-weight:700;text-align:center;letter-spacing:-.02em}
.stage{display:grid;grid-template-columns:repeat(5,1fr);gap:4px;text-align:center}
.stage div{background:var(--slab2);border-radius:8px;padding:6px 2px}
.stage b{display:block;font-family:var(--f-mono);font-size:16px}
.stage small{font-size:10px;color:var(--dim)}
.reel{background:var(--slab2);border-radius:10px;padding:10px 12px;display:flex;justify-content:space-between;align-items:center;gap:10px}
.reel .rt{font-weight:600;font-size:14px}
.hab{display:grid;grid-template-columns:1fr auto auto;gap:10px;align-items:center;padding:11px 0;border-bottom:1px solid var(--line)}
.hab:last-of-type{border-bottom:0}
.hab .hn{font-weight:600}
.hab .hs{font-size:12px;color:var(--dim);font-family:var(--f-mono)}
.slipbtn{border:1px solid var(--line);background:var(--slab2);border-radius:10px;padding:8px 10px;font-size:13px;font-weight:600;white-space:nowrap}
.slipct{font-family:var(--f-mono);font-size:18px;min-width:28px;text-align:center}
.dot{width:10px;height:10px;border-radius:50%;display:inline-block}
.week7{display:flex;gap:3px}
.week7 i{width:9px;height:9px;border-radius:2px;background:var(--line)}
.week7 i.g{background:var(--good)} .week7 i.b{background:var(--bad)}
.revgrid{display:grid;grid-template-columns:1fr 1fr;gap:8px}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (max-width:380px){.stats{grid-template-columns:repeat(2,1fr)}}
[hidden]{display:none!important}
img{max-width:100%}
html{background:#0f1113}
.wrap{padding-top:calc(16px + env(safe-area-inset-top,0px))}
body{-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
#login{position:fixed;inset:0;z-index:60;background:var(--coal);display:grid;place-items:center;padding:24px}
#login .box{width:100%;max-width:360px;display:flex;flex-direction:column;gap:12px}
#login .logo{font-family:var(--f-display);font-weight:800;font-size:40px}
#login .logo span{color:var(--ice)}
</style>
</head><body>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script>
/* ---------- static plan ---------- */
const TARGETS = { kcal: 2700, p: 150, c: 350, f: 75, foodMonth: 180 };
const PLAN = {
  0:{w:"Rest",lap:"Sunday reset: groceries + cook session with my sister · 45-min weekly planning",ex:[]},
  1:{w:"Upper A",lap:"Trade review + journal",ex:["Pull-ups 4×6–10","DB bench 4×8–12","DB rows 3×8–12","DB shoulder press 3×8–12","Curls + triceps 3×10–12"]},
  2:{w:"Lower A",lap:"Rough cuts (batch edit)",ex:["Goblet / DB squat 4×8–12","DB Romanian deadlift 3×8–12","Walking lunges 3×10/leg","Calf raises 3×12–15","Core 3 rounds"]},
  3:{w:"Climb night with my brothers & sister",lap:"Sledge B business",ex:["Easy climbing / technique","Active recovery: have fun with them"]},
  4:{w:"Upper B",lap:"Polish + schedule reels",ex:["Chin-ups 4×6–10","Incline DB press 4×8–12","One-arm DB row 3×8–12","Lateral raises 3×12–15","Dips 3×AMRAP"]},
  5:{w:"Lower B",lap:"Brick Empire / flex",ex:["Bulgarian split squat 3×8–10/leg","DB hip thrust 4×8–12","Step-ups 3×10/leg","Hanging leg raises 3×10–15"]},
  6:{w:"Optional climb",lap:"Sledge B events · Saturday breakfast with my brothers & sister",ex:["Bouldering session (back, grip, forearms)"]}
};
const DAYNAMES=["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const PRESETS = [
  {name:"Power shake (milk, whey, oats, PB, banana)",kcal:800,p:45,c:85,f:30,cost:2},
  {name:"Chipotle double-chicken bowl",kcal:900,p:75,c:95,f:22,cost:15},
  {name:"Chick-fil-A grilled nuggets 12ct + side salad",kcal:400,p:48,c:14,f:16,cost:13},
  {name:"Wendy's grilled chicken sandwich",kcal:370,p:34,c:38,f:10,cost:8},
  {name:"Velocity bag: rotisserie chicken + rice cup + salad kit",kcal:750,p:55,c:70,f:25,cost:5},
  {name:"Turkey wrap + string cheese",kcal:450,p:35,c:35,f:18,cost:3},
  {name:"Greek yogurt + banana",kcal:250,p:20,c:38,f:3,cost:2},
];
const RULES = [
  ["plan","Entry came from my pre-market plan"],
  ["size","Size matched the plan (no oversizing)"],
  ["noRevenge","Not a revenge trade"],
  ["noFomo","Not a FOMO chase"],
  ["window","Inside the 9:30–10:30 window"],
];
const EVAL_CAP=2; // evaluations or resets per month
const FIRMS=["Topstep","Alpha Futures","Other"];
function evalsThisMonth(){const pre=TODAY.slice(0,7);const out=[];for(const k in days)if(k.startsWith(pre))(days[k].spend||[]).forEach(x=>{if(x.eval)out.push({...x,k})});return out}
function evalCard(){
  const ev=evalsThisMonth(),n=ev.length,amt=ev.reduce((t,x)=>t+(+x.amt||0),0),ds=discipline(10),over=n>=EVAL_CAP;
  const firm=ui.firm||FIRMS[0];
  return `<div class="eyebrow">Evaluations &amp; resets this month</div>
  <div class="card gap">
    <div class="row" style="justify-content:space-between;align-items:baseline"><span class="big" style="color:${over?"var(--bad)":"var(--ink)"}">${n}/${EVAL_CAP}</span><span class="mono" style="color:${amt>0?"var(--bad)":"var(--dim)"}">${money(amt)} spent</span></div>
    ${over?`<div class="banner bad"><div><strong>Cap reached</strong>No more evals or resets this month. The next one gets earned with a discipline score of 80%+ (you're at ${ds==null?"—":ds+"%"}).</div></div>`:`<div class="muted">Cap: ${EVAL_CAP} a month. Your Discover history averages ~$240/mo on Topstep, Alpha Futures and TradingView.</div>`}
    <div class="chips">${FIRMS.map(f=>`<button class="chip" data-firm="${f}" aria-pressed="${firm===f}">${f}</button>`).join("")}</div>
    <div class="row" style="flex-wrap:nowrap"><input type="number" id="evalAmt" inputmode="decimal" placeholder="Amount ($)"><button class="btn sm ${over?"ghost":""}" data-act="logEval">${over?"Log anyway":"Log purchase"}</button></div>
    ${ev.length?ev.map(x=>`<div class="item"><span>${esc(x.what)}</span><span class="m">${x.k.slice(5)} · ${money(+x.amt)}</span></div>`).join(""):""}
  </div>`;
}
const TRIGGERS=["Stressed","Bored","Deep in work","Watching charts","Tired","Anxious"];
let habits={list:[{id:"nails",name:"Biting my nails",since:"2026-09-23"}]};
function loadHabits(){try{const x=JSON.parse(localStorage.getItem("cole.habits")||"null");if(x&&Array.isArray(x.list))habits=x}catch(e){}}
let habPending=Promise.resolve();
function saveHabits(){try{localStorage.setItem("cole.habits",JSON.stringify(habits))}catch(e){}
  if(!db)return;const body=JSON.parse(JSON.stringify(habits));habPending=habPending.then(()=>db.doc("meta/habits").set(body)).catch(e=>setSync("Couldn't save habits ("+e.code+")."))}
const slipsOn=(k,id)=>((days[k]||{}).slips||{})[id]||0;
function habStreak(h){let n=0;const d=new Date(now);if(slipsOn(keyOf(d),h.id)>0)return 0;
  for(let i=0;i<400;i++){const k=keyOf(d);if(k<h.since)break;if(slipsOn(k,h.id)>0)break;n++;d.setDate(d.getDate()-1)}return n}
function tradeStatus(k){const x=days[k];if(!x||!x.trades.length)return null;return dayClean(x)}
function week7(fn){const out=[];const d=new Date(now);for(let i=6;i>=0;i--){const c=new Date(d);c.setDate(d.getDate()-i);out.push(fn(keyOf(c)))}return out}
function disciplineToday(){
  const items=habits.list.map(h=>slipsOn(TODAY,h.id)===0);
  const ts=tradeStatus(TODAY); if(ts!==null)items.push(ts);
  return items.length?Math.round(100*items.filter(Boolean).length/items.length):null;
}
function disciplineCard(){
  const ts=tradeStatus(TODAY),dt=disciplineToday();
  const sq=v=>`<i class="${v===true?"g":v===false?"b":""}"></i>`;
  const tradeRow=`<div class="hab"><div><div class="hn">Trading rules</div><div class="hs">${streak()} clean trading days · ${ts===null?"no trades yet":ts?"clean today":"rule broken today"}</div></div><div class="week7">${week7(tradeStatus).map(sq).join("")}</div><span></span></div>`;
  const rows=habits.list.map(h=>{const n=slipsOn(TODAY,h.id),st=habStreak(h);
    return `<div class="hab"><div><div class="hn">${esc(h.name)}</div><div class="hs">${n?`${n} slip${n>1?"s":""} today`:st?`${st} day${st>1?"s":""} clean`:"clean so far today"}</div><div class="week7" style="margin-top:5px">${week7(k=>k<h.since?null:slipsOn(k,h.id)===0).map(sq).join("")}</div></div>
      ${ui.habEdit?`<button class="x" data-delhab="${h.id}" aria-label="Remove habit">×</button>`:`<span class="slipct" style="color:${n?"var(--bad)":"var(--dim)"}">${n}</span>`}

/* ---------- derived ---------- */
const sum=(a,f)=>a.reduce((s,x)=>s+(+x[f]||0),0);
function macros(k=TODAY){const m=day(k).meals;return{kcal:sum(m,"kcal"),p:sum(m,"p"),c:sum(m,"c"),f:sum(m,"f")}}
function foodSpendMonth(){const pre=TODAY.slice(0,7);let t=0;for(const k in days)if(k.startsWith(pre))t+=sum(days[k].meals,"cost")+sum(days[k].spend.filter(s=>s.cat==="Food"),"amt");return t}
function tradeClean(t){return RULES.every(([k])=>t.rules&&t.rules[k])}
function dayClean(d){return d.trades.length<=2 && d.trades.every(tradeClean)}
function discipline(n){const ks=Object.keys(days).filter(k=>days[k].trades.length).sort().slice(-n);if(!ks.length)return null;return Math.round(100*ks.filter(k=>dayClean(days[k])).length/ks.length)}
function streak(){let s=0;const ks=Object.keys(days).filter(k=>days[k].trades.length).sort().reverse();for(const k of ks){if(dayClean(days[k]))s++;else break}return s}
function lossLeft(){const t=day().lossAt;if(!t)return 0;return Math.max(0,15*60-Math.floor((Date.now()-t)/1000))}
const money=n=>"$"+(Math.round(n*100)/100).toLocaleString(undefined,{minimumFractionDigits:0,maximumFractionDigits:2});
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));

const toMin=s=>{const [h,m]=s.split(":").map(Number);return h*60+m};
const fmt12=s=>{let [h,m]=s.split(":").map(Number);const ap=h>=12?"PM":"AM";h=h%12||12;return `${h}:${pad(m)} ${ap}`};
function nowNext(){
  const list=sched(now.getDay()).filter(b=>b.t.includes(":")),m=now.getHours()*60+now.getMinutes();
  let cur=null,next=list[0]||null;
  list.forEach((b,i)=>{if(toMin(b.t)<=m){cur=b;next=list[i+1]||null}});
  return {cur,next,m};
}
function laptopLeft(){const L=day().laptop;if(!L.startedAt||L.result)return 0;return Math.max(0,50*60-Math.floor((Date.now()-L.startedAt)/1000))}
function laptopStats(n=14){
  const ks=Object.keys(days).sort().slice(-n),r={gym:{t:0,d:0},home:{t:0,d:0}};
  ks.forEach(k=>{const L=days[k].laptop||{};if(L.where&&L.result){r[L.where].t++;if(L.result==="done")r[L.where].d++}});
  return r;
}
function homeSlipping(){
  const ks=Object.keys(days).filter(k=>k<TODAY&&days[k].laptop&&days[k].laptop.where).sort().slice(-2);
  return ks.length===2&&ks.every(k=>days[k].laptop.where==="home"&&days[k].laptop.result!=="done");
}

function vPlan(){

  const rows=list.map(b=>{
    const timed=b.t.includes(":"),past=timed&&toMin(b.t)<m&&cur&&cur.id!==b.id,isNow=cur&&cur.id===b.id;
    const cls=["blk",b.kind==="sub"?"sub":"",b.kind||"",d.sched[b.id]?"done":"",past?"past":"",isNow?"now":""].join(" ");
    if(b.kind==="head") return `<div class="${cls}" style="cursor:default"><span class="tm">${fmt12(b.t).replace(" ","")}</span><span><div class="bt">${esc(b.title)}</div><div class="bd">${esc(b.detail)}</div></span><span></span></div>`;

  }).join("");
  const order=[1,2,3,4,5,6,0];
  return `
  ${nowCard()}
  <div class="eyebrow">Today's schedule · ${done}/${list.filter(b=>b.kind!=="head").length} done</div>
  <div class="card tl" style="padding:6px">${rows}</div>
  ${wd>=1&&wd<=5?`<div class="eyebrow">Laptop hour</div>${laptopCard()}`:""}

  <div class="card gap">
    ${p.ex.length?`<ol class="ex">${p.ex.map(e=>`<li>${e}</li>`).join("")}</ol>`:`<div class="muted">Rest day. Walk, stretch, be with the family.</div>`}

  </div>

}

function weekKeys(){const out=[];const d=new Date(now);for(let i=0;i<7;i++){out.push(keyOf(d));d.setDate(d.getDate()-1)}return out.reverse()}
function reviewData(){
  const ks=weekKeys(),D=ks.map(k=>days[k]||blankDay());
  const tDays=D.filter(d=>d.trades.length),clean=tDays.filter(dayClean);
  const trades=D.flatMap(d=>d.trades);
  const cleanPnl=sum(clean.flatMap(d=>d.trades),"pnl"),dirtyPnl=sum(tDays.filter(d=>!dayClean(d)).flatMap(d=>d.trades),"pnl");
  const broken={};RULES.forEach(([k,l])=>broken[l]=trades.filter(t=>!(t.rules&&t.rules[k])).length);
  const overLimit=D.filter(d=>d.trades.length>2).length;
  const feel={};D.forEach(d=>(d.checkin&&d.checkin.feel||[]).forEach(f=>feel[f]=(feel[f]||0)+1));
  const topFeel=Object.entries(feel).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const gym=D.filter(d=>d.gym||(d.sched&&d.sched.lift)).length;
  const reels=D.filter(d=>d.reel).length+pipe.reels.filter(r=>r.postedOn&&ks.includes(r.postedOn)&&!(days[r.postedOn]&&days[r.postedOn].reel)).length;
  const fedDays=D.filter(d=>d.meals.length),prot=fedDays.length?Math.round(sum(fedDays.map(d=>({p:sum(d.meals,"p")})),"p")/fedDays.length):0;
  const food=D.reduce((t,d)=>t+sum(d.meals,"cost")+sum(d.spend.filter(s=>s.cat==="Food"),"amt"),0);
  const lap={gym:{t:0,d:0},home:{t:0,d:0}};D.forEach(d=>{const L=d.laptop||{};if(L.where&&L.result){lap[L.where].t++;if(L.result==="done")lap[L.where].d++}});
  const habWeek=habits.list.map(h=>({name:h.name,slips:ks.reduce((t,k)=>t+slipsOn(k,h.id),0),clean:ks.filter(k=>k>=h.since&&slipsOn(k,h.id)===0).length}));
  const trig={};D.forEach(d=>(d.slipLog||[]).forEach(x=>{if(x.trigger)trig[x.trigger]=(trig[x.trigger]||0)+1}));
  const topTrig=Object.entries(trig).sort((a,b)=>b[1]-a[1]).slice(0,3);
  const schedPct=(()=>{let a=0,b=0;ks.forEach((k,i)=>{const s=sched(new Date(k+"T12:00").getDay()).filter(x=>x.kind!=="head");b+=s.length;a+=s.filter(x=>D[i].sched&&D[i].sched[x.id]).length});return b?Math.round(100*a/b):0})();
  return {range:ks[0]+" → "+ks[6],tradeDays:tDays.length,cleanDays:clean.length,disc:tDays.length?Math.round(100*clean.length/tDays.length):null,trades:trades.length,cleanPnl,dirtyPnl,broken,overLimit,topFeel,habWeek,topTrig,gym,reels,prot,food,lap,schedPct};
}

async function coachReview(){
  if(!sample){ui.revErr="The AI read runs in Claude. The numbers above are your full review.";return render()}
  ui.revBusy=true;ui.revErr="";render();
  try{
    const r=reviewData();
    const out=await sample(`You are Cole, Nick's accountability coach. Nick is a Mercedes tech who day trades YM/MYM futures with rules (max 2 trades/day, no revenge, no oversizing, no FOMO, trade only 9:30-10:30), is on a lean bulk, and wants to support his family through trading. Be direct and specific, no fluff, no trade picks or financial advice. Here is his week as JSON: ${JSON.stringify(r)}. Write 3 short parts: "The pattern:" (1-2 sentences), "What it cost:" (1-2 sentences using the numbers), "One fix for next week:" (one concrete action). If data is thin, say what to log more of.`,{modelTier:"default"});
    ui.revText=out.text;
  }catch(e){ui.revErr=e&&e.code==="not_granted"?"Allow Cole to ask Claude, then try again.":"Couldn't get a read right now. Try again in a minute."}
  ui.revBusy=false;render();
}

async function estimate(){
  const txt=(document.getElementById("mealText")||{}).value?.trim(); if(!txt){ui.estErr="Type what you ate first.";return render()}
  if(!sample){const n=txt.match(/(\d+)\s*(?:kcal|cal)/i),pr=txt.match(/(\d+)\s*(?:g\s*)?(?:protein|p\b)/i);ui.est={items:[{name:txt.replace(/\d+\s*(kcal|cal|g protein|protein|p\b)/gi,"").trim().slice(0,80)||txt,kcal:n?+n[1]:0,p:pr?+pr[1]:0,c:0,f:0}]};ui.estErr=n||pr?"":"Tip: add numbers, e.g. \"Chipotle bowl 900 cal 75 protein\"";return render()}
  ui.estBusy=true;ui.estErr="";render();
  try{
    const out=await sample.json(`Estimate nutrition for this meal as ordered at a US restaurant or store. Meal: "${txt}". Return JSON only: {"items":[{"name":string,"kcal":integer,"p":integer,"c":integer,"f":integer}]} with one item per distinct food, grams for p/c/f. Use typical published values for the chain if named.`,{modelTier:"quick"});
    const items=(out&&out.items||[]).map(i=>({name:String(i.name||txt).slice(0,80),kcal:Math.round(+i.kcal||0),p:Math.round(+i.p||0),c:Math.round(+i.c||0),f:Math.round(+i.f||0)}));
    if(!items.length) throw {message:"No estimate came back."};
    ui.est={items};
  }catch(e){ui.estErr=e&&e.code==="not_granted"?"Allow Cole to ask Claude to use estimates.":"Couldn't estimate that one. Try rewording, or use a favorite."}
  ui.estBusy=false;render();
}

function makeDb(){

      onSnapshot(next,err){listeners.push({key:path,exact:true,fn:r=>next(snap(path,r))});

      onSnapshot(next,err){listeners.push({key:prefix+"/",exact:false,fn:(r,p)=>next({docs:[snap(p,r)]})});
